# setting the minimum release age to 5 days (7200 minutes) to ensure that releases are stable before being used in the workspace
minimumReleaseAge: 7200
blockExoticSubdeps: true
minimumReleaseAgeStrict: false 
# Security patch for GHSA-x9jw-j844-v24h, exempted from the release age wait.
# Pinned to the exact version so later @nuxt/ui releases still wait 5 days.
minimumReleaseAgeExclude:
  - "@nuxt/ui@4.13.0"

allowBuilds:
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

