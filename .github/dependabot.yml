version: 2
updates:
  # Propose Node base image bumps (security releases) for the Dockerfile.
  # When merging one, bump node-version in the deploy and metrics workflows
  # and node in mise.toml to the same version.
  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
